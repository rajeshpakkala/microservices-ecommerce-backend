server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      routes:

        # AUTH SERVICE
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/ecommerce/api/auth/**

        # PRODUCT SERVICE
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/ecommerce/api/products/**
jwt:
  secret: mysecretkeymysecretkeymysecretkey123456

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8083

spring:
  application:
    name: ORDER-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_order_db
    username: postgres
    password: mypassword

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Direct URL — remove this when Eureka is running with all services
product:
  service:
    url: http://localhost:8081
